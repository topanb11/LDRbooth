<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800">
  <defs>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="40" height="20" fill="#e8dcc8"/>
      <rect y="20" width="40" height="20" fill="#f2ead9"/>
    </pattern>
  </defs>
  <rect width="400" height="800" fill="#f2ead9"/>
  <rect width="400" height="800" fill="url(#stripes)" opacity="0.35"/>
</svg>
